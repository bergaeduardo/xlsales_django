{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Iniciar sesión — XLSales</title>
  <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css" rel="stylesheet"/>
</head>
<body class="d-flex flex-column">
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <h1 class="navbar-brand navbar-brand-autodark">XLSales</h1>
    </div>
    <div class="card card-md">
      <div class="card-body">
        <h2 class="h2 text-center mb-4">Ingresar al sistema</h2>

        {% if form.errors %}
        <div class="alert alert-danger alert-dismissible">
          Usuario o contraseña incorrectos.
        </div>
        {% endif %}

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="post" action="">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" class="form-control" placeholder="usuario" autofocus required>
          </div>
          <div class="mb-2">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" placeholder="contraseña" required>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
</body>
</html>
