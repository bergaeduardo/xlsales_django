[tool.poetry]
name = "xlsales-django"
version = "0.1.0"
description = "Migración XLSales (Arreglos + CADS) a Django"
authors = ["Berga Eduardo"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
Django = "^5.0"
mssql-django = "^1.3"
pyodbc = "^5.0"
django-environ = "^0.11"
django-axes = "^6.1"
django-simple-history = "^3.4"
WeasyPrint = "^60.0"
djangorestframework = "^3.15"
waitress = "^3.0"
sentry-sdk = "^1.39"

[tool.poetry.group.dev.dependencies]
django-extensions = "^3.2"
django-debug-toolbar = "^4.2"
pytest-django = "^4.7"
pytest-cov = "^4.1"
factory-boy = "^3.3"
black = "^23.12"
isort = "^5.13"
flake8 = "^7.0"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | migrations
  | staticfiles
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*", "*/staticfiles/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_test.py"]
addopts = "--cov=. --cov-report=html --cov-omit=*/migrations/*,*/venv/*,manage.py,conftest.py"
