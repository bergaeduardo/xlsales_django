blocker:
  archivo: arreglos/models.py
  estado: untracked (work-in-progress de net-migrator, nunca commiteado)
  error: |
    SyntaxError: unexpected character after line continuation character
    File "arreglos/models.py", line 30
        id = models.AutoField(primary_key=True, db_column=\"Id\")
                                                           ^
  causa: >
    El archivo contiene comillas escapadas (\") dentro de strings de Python,
    lo que Python 3 interpreta como backslash + carácter y falla en el parse.
    Django llama a import_models() al inicializar arreglos.apps.ArreglosConfig
    (presente en INSTALLED_APPS desde commit 72a3f31), lo que dispara el SyntaxError.
  solucion_requerida: >
    net-migrator debe reemplazar todas las ocurrencias de \" por " en arreglos/models.py
    (78 líneas afectadas según grep). Es un sed one-liner:
      sed -i 's/\\\"/"  /g' arreglos/models.py
    Una vez corregido y el archivo commiteado, el entorno de test debería levantar.

